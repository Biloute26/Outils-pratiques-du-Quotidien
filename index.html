<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Démo — Navigation par catégories</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F3EE;--surface:#FFFFFF;--surface2:#EDEDEA;--border:#D8D5CE;
  --text:#1A1916;--muted:#6B6860;--accent:#2A6B4F;--accent-light:#E3F0EA;
  --radius:12px;--sans:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}

.demo-wrap{width:100%;max-width:900px;background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden;display:grid;grid-template-columns:280px 1fr;height:580px}

/* ── COL GAUCHE ── */
.left{display:flex;flex-direction:column;border-right:1px solid var(--border);padding:14px;overflow:hidden;gap:8px}
.section-label{font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:500}

/* Grille catégories */
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;flex-shrink:0}
.cnb{padding:7px 3px;border:1px solid var(--border);border-radius:8px;font-size:9px;font-weight:700;cursor:pointer;background:var(--surface);color:var(--text);line-height:1.5;text-align:center;transition:all .15s;font-family:var(--sans)}
.cnb:hover:not(.active){background:var(--accent-light);border-color:var(--accent)}
.cnb.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Titre catégorie active */
.cat-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:6px 10px;border-radius:8px;border-left:3px solid;display:flex;align-items:center;gap:6px;flex-shrink:0}

/* Liste outils */
.tools-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:3px;padding-right:2px}
.tools-list::-webkit-scrollbar{width:3px}
.tools-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.tool-card{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--surface);border:1px solid transparent;border-radius:var(--radius);cursor:pointer;transition:all .15s;border-left:3px solid transparent}
.tool-card:hover{border-left-color:var(--accent);background:var(--accent-light)}
.tool-card.active{border-left-color:var(--accent);background:var(--accent-light)}
.tool-icon{font-size:18px;width:28px;text-align:center;flex-shrink:0}
.tool-name{font-size:12px;font-weight:600;color:var(--text);line-height:1.3}
.tool-desc{font-size:10px;color:var(--muted);margin-top:1px}

/* ── COL DROITE ── */
.right{display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--muted);font-size:13px;text-align:center;padding:2rem}
.right-placeholder{display:flex;flex-direction:column;align-items:center;gap:12px}
.right-placeholder .big{font-size:48px}
.right-placeholder .title{font-size:15px;font-weight:600;color:var(--text)}
.right-placeholder .sub{font-size:12px;color:var(--muted)}
.right-active{display:flex;flex-direction:column;align-items:center;gap:10px}
.right-active .tool-big{font-size:52px}
.right-active .tool-title{font-size:18px;font-weight:600;color:var(--text)}
.right-active .tool-cat{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px}
.right-active .tool-detail{font-size:13px;color:var(--muted);max-width:320px;text-align:center;line-height:1.6}

/* Dark mode */
@media(prefers-color-scheme:dark){
  :root{--bg:#0F1117;--surface:#1A1D27;--surface2:#232635;--border:#2E3248;--text:#E8EAF0;--muted:#8B93B0;--accent:#4ADE80;--accent-light:#1A2E1F}
}
</style>
</head>
<body>

<div class="demo-wrap">

  <!-- COLONNE GAUCHE -->
  <div class="left">
    <p class="section-label">Outils</p>

    <div class="cat-grid" id="cat-grid"></div>

    <div class="cat-label" id="cat-label" style="background:#FFF7ED;color:#C2410C;border-color:#F97316">
      💰 Finance
    </div>

    <div class="tools-list" id="tools-list"></div>
  </div>

  <!-- COLONNE DROITE -->
  <div class="right" id="right-col">
    <div class="right-placeholder">
      <div class="big">🛠️</div>
      <div class="title">Sélectionnez un outil</div>
      <div class="sub">Cliquez sur une carte pour commencer</div>
    </div>
  </div>

</div>

<script>

    {icon:'🔥',name:'Calculateur de calories',desc:'Dépense & besoins journaliers'},

  ]},
  {key:'monde', icon:'🌍', label:'Voyage', bg:'#EFF6FF', color:'#1D4ED8', border:'#3B82F6', tools:[
    {icon:'🌤️',name:'Météo',desc:'Prévisions 7 jours heure par heure'},
    {icon:'🕐',name:'Décalage horaire',desc:'100+ villes du monde'},
    {icon:'📞',name:'Indicatifs téléphoniques',desc:'Codes pays du monde'},
    {icon:'🌐',name:'Traducteur',desc:'30+ langues, traduction instantanée'},
    {icon:'📆',name:'Calculateur de jours',desc:'Entre deux dates, délais'},
    {icon:'🗺️',name:'Distance entre villes',desc:'Vol d\'oiseau, route estimée'},
  ]},
  {key:'sport', icon:'⚽', label:'Sport', bg:'#FDF4FF', color:'#7E22CE', border:'#A855F7', tools:[
    {icon:'⚽',name:'Foot Europe',desc:'Classements et résultats live'},

    {icon:'🧠',name:'Quiz culture générale',desc:'Questions générées par IA'},

  ]},
  {key:'tech', icon:'🛠️', label:'Tech', bg:'#F0F9FF', color:'#0369A1', border:'#0EA5E9', tools:[
    {icon:'🔐',name:'Générateur de mot de passe',desc:'Mots de passe sécurisés'},
    {icon:'📱',name:'QR Code',desc:'Générateur et lecteur'},

    {icon:'🔍',name:'Testeur Regex',desc:'Expressions régulières en live'},
    {icon:'📦',name:'Formateur JSON / XML',desc:'Indenter, valider, minifier'},
    {icon:'🗺️',name:'Distance entre villes',desc:'Vol d\'oiseau, route'},

    {icon:'🎯',name:'Générateur de pseudo',desc:'Noms, usernames aléatoires'},
    {icon:'🎨',name:'Palette de couleurs',desc:'HEX ↔ RGB ↔ HSL'},
  ]},
  {key:'docs', icon:'✍️', label:'Docs IA', bg:'#F5F3FF', color:'#5B21B6', border:'#7C3AED', tools:[
    {icon:'✍️',name:'Correcteur & Reformulateur',desc:'Corrige, reformule, améliore'},
    {icon:'📄',name:'Résumeur de texte',desc:'Résumé IA instantané'},

  ]},
  {key:'maison', icon:'🏠', label:'Maison', bg:'#ECFDF5', color:'#065F46', border:'#10B981', tools:[
    {icon:'⛽',name:'Coût trajet voiture',desc:'Carburant, péages, coût km'},
    {icon:'📏',name:'Calculateur de surface',desc:'Pièce, carrelage, peinture'},
    {icon:'🔧',name:'Calculs techniques',desc:'Béton, électricité, plomberie'},

    {icon:'🌈',name:'Générateur de dégradés CSS',desc:'Visuel + code CSS'},
    {icon:'📋',name:'Comparateur de textes',desc:'Différences entre 2 versions'},
    {icon:'📦',name:'Frais de port',desc:'Colissimo, Chronopost...'},
  ]},
  {key:'business', icon:'💼', label:'Pro', bg:'#FFF7ED', color:'#9A3412', border:'#EA580C', tools:[
    {icon:'💹',name:'Calculateur de marge',desc:'Marge, bénéfice, remise'},
    {icon:'🧾',name:'Générateur de facture',desc:'Facture PDF professionnelle'},
    {icon:'🧾',name:'Calculateur TVA',desc:'HT ↔ TTC, tous taux'},
    {icon:'🛒',name:'Note de frais',desc:'Qui doit combien à qui ?'},
  ]},
  {key:'fun', icon:'🎮', label:'Fun', bg:'#FDF2F8', color:'#831843', border:'#EC4899', tools:[
    {icon:'🧠',name:'Quiz culture générale',desc:'Questions IA'},
    {icon:'😄',name:'Blagues & Citations',desc:'Générateur IA'},
    {icon:'🎲',name:'Roue de la fortune',desc:'Tirage aléatoire'},
    {icon:'🔮',name:'Boule de Cristal',desc:'Prédiction du jour — touchez la boule'},
    {icon:'🃏',name:'Tirage de Tarot',desc:'Tirage en croix — 5 cartes'},
    {icon:'💞',name:'Compatibilité astro',desc:'Deux signes — affinités & conseils'},
    {icon:'✨',name:'Horoscope',desc:'Du jour par signe'},
  ]},
  {key:'calculs', icon:'📐', label:'Calculs', bg:'#FFF1F2', color:'#BE123C', border:'#F43F5E', tools:[
    {icon:'🔢',name:'Calculatrice scientifique',desc:'sin, cos, log, racines...'},
    {icon:'📐',name:'Convertisseur d\'unités',desc:'km/miles, kg/lbs, °C/°F...'},
    {icon:'📅',name:'Calendrier',desc:'Calendrier mensuel interactif'},
    {icon:'⏱️',name:'Minuteur & Chrono',desc:'Compte à rebours'},
    {icon:'📦',name:'Frais de port',desc:'Colissimo, Chronopost...'},
    {icon:'🔧',name:'Calculs techniques',desc:'Béton, électricité, plomberie...'},
  ]},
  {key:'tv', icon:'📻', label:'Radio', bg:'#FFF8E7', color:'#B45309', border:'#F59E0B', tools:[
    {icon:'📻',name:'Répertoire Radio mondial',desc:'150+ radios en direct par pays'},
  ]},
  {key:'vie', icon:'🛒', label:'Vie', bg:'#FFF0F0', color:'#991B1B', border:'#EF4444', tools:[
    {icon:'🛒',name:'Coût de la vie',desc:'Prix du quotidien, carburant, énergie...'},
  ]},
];

let currentCat = 'finance';

function renderCatGrid() {
  const grid = document.getElementById('cat-grid');
  grid.innerHTML = CATS.map(c =>
    `<button class="cnb${c.key===currentCat?' active':''}" onclick="selectCat('${c.key}')">${c.icon}<br>${c.label}</button>`
  ).join('');
}

function renderTools(catKey) {
  const cat = CATS.find(c => c.key === catKey);
  if (!cat) return;

  // Label catégorie
  const lbl = document.getElementById('cat-label');
  lbl.style.background = cat.bg;
  lbl.style.color = cat.color;
  lbl.style.borderColor = cat.border;
  lbl.textContent = cat.icon + ' ' + cat.label;

  // Outils
  const list = document.getElementById('tools-list');
  list.innerHTML = cat.tools.map((t, i) =>
    `<div class="tool-card" onclick="selectTool('${catKey}',${i})">
      <span class="tool-icon">${t.icon}</span>
      <div>
        <div class="tool-name">${t.name}</div>
        <div class="tool-desc">${t.desc}</div>
      </div>
    </div>`
  ).join('');
}

function selectCat(key) {
  currentCat = key;
  renderCatGrid();
  renderTools(key);
  document.getElementById('right-col').innerHTML = `<div class="right-placeholder"><div class="big">${CATS.find(c=>c.key===key).icon}</div><div class="title">${CATS.find(c=>c.key===key).label}</div><div class="sub">Cliquez sur un outil pour l'ouvrir</div></div>`;
}

function selectTool(catKey, idx) {
  const cat = CATS.find(c => c.key === catKey);
  const t = cat.tools[idx];
  document.querySelectorAll('.tool-card').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.tool-card')[idx].classList.add('active');
  document.getElementById('right-col').innerHTML = `
    <div class="right-active">
      <div class="tool-big">${t.icon}</div>
      <div class="tool-title">${t.name}</div>
      <div class="tool-cat" style="background:${cat.bg};color:${cat.color}">${cat.icon} ${cat.label}</div>
      <div class="tool-detail">${t.desc}<br><br><span style="opacity:0.5;font-size:11px">Sur votre vrai site, l'outil s'affiche ici →</span></div>
    </div>`;
}

renderCatGrid();
renderTools('finance');
</script>
</body>
</html>
