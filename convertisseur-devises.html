<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Convertisseur de devises</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f5f5f0;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
      min-height: 100vh;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      border: 1px solid #e8e8e4;
      padding: 1.75rem;
      width: 100%;
      max-width: 540px;
      height: fit-content;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.75rem;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-box {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: #f0f0eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .title { font-size: 17px; font-weight: 600; color: #1a1a1a; }
    .subtitle { font-size: 12px; color: #888; display: flex; align-items: center; gap: 5px; margin-top: 2px; }

    .live-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #22c55e;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }

    .print-btn {
      font-size: 12px;
      color: #555;
      background: #f5f5f0;
      border: 1px solid #e0e0da;
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .print-btn:hover { background: #ececea; }

    .row { display: grid; grid-template-columns: 1fr 44px 1fr; gap: 10px; align-items: end; margin-bottom: 1.25rem; }

    .field-label { font-size: 10px; font-weight: 600; color: #999; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 5px; }

    input[type="number"] {
      width: 100%;
      font-size: 20px;
      font-weight: 600;
      color: #1a1a1a;
      border: 1.5px solid #e0e0da;
      border-radius: 10px;
      padding: 10px 13px;
      outline: none;
      background: #fff;
      transition: border-color 0.15s;
      -moz-appearance: textfield;
    }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
    input[type="number"]:focus { border-color: #999; }

    .result-box {
      font-size: 20px;
      font-weight: 600;
      color: #1a1a1a;
      border: 1.5px solid #eee;
      border-radius: 10px;
      padding: 10px 13px;
      background: #f8f8f5;
      min-height: 50px;
      display: flex;
      align-items: center;
    }

    .swap-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 1px solid #e0e0da;
      background: #fff;
      color: #666;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px;
      margin-bottom: 2px;
      transition: background 0.15s, transform 0.2s;
    }
    .swap-btn:hover { background: #f5f5f0; transform: rotate(180deg); }

    .selects-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1.25rem; }

    select {
      width: 100%;
      padding: 9px 10px;
      border: 1.5px solid #e0e0da;
      border-radius: 10px;
      background: #fff;
      color: #1a1a1a;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      outline: none;
    }
    select:focus { border-color: #999; }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #f0f0eb;
      padding-top: 12px;
      font-size: 12px;
      color: #999;
    }

    .refresh-btn {
      font-size: 12px;
      color: #888;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .refresh-btn:hover { background: #f5f5f0; color: #333; }

    .spin { animation: spin 0.8s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 480px) {
      body { padding: 1rem 0.75rem; }
      .card { padding: 1.25rem; }
    }
  </style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="header-left">
      <div class="icon-box">💱</div>
      <div>
        <div class="title">Convertisseur de devises</div>
        <div class="subtitle"><span class="live-dot"></span> Taux de change en temps réel</div>
      </div>
    </div>
    <button class="print-btn" onclick="window.print()">🖨 Imprimer</button>
  </div>

  <div class="row">
    <div>
      <div class="field-label">Montant</div>
      <input type="number" id="amount" value="1" min="0" />
    </div>
    <button class="swap-btn" id="swapBtn" title="Inverser">⇄</button>
    <div>
      <div class="field-label">Résultat</div>
      <div class="result-box" id="result">—</div>
    </div>
  </div>

  <div class="selects-row">
    <div>
      <div class="field-label">De</div>
      <select id="from"></select>
    </div>
    <div>
      <div class="field-label">Vers</div>
      <select id="to"></select>
    </div>
  </div>

  <div class="footer">
    <span id="rateInfo">Chargement des taux...</span>
    <button class="refresh-btn" id="refreshBtn">
      <span id="refreshIcon">↻</span> Actualiser
    </button>
  </div>
</div>

<script>
const CURRENCIES = [
  ["EUR","Euro"],["USD","Dollar américain"],["GBP","Livre sterling"],
  ["JPY","Yen japonais"],["CHF","Franc suisse"],["CAD","Dollar canadien"],
  ["AUD","Dollar australien"],["CNY","Yuan chinois"],["HKD","Dollar HK"],
  ["SGD","Dollar de Singapour"],["NOK","Couronne norvégienne"],["SEK","Couronne suédoise"],
  ["DKK","Couronne danoise"],["MXN","Peso mexicain"],["BRL","Réal brésilien"],
  ["INR","Roupie indienne"],["KRW","Won sud-coréen"],["TRY","Lire turque"],
  ["PLN","Zloty polonais"],["CZK","Couronne tchèque"],["MAD","Dirham marocain"],
  ["AED","Dirham des EAU"],["SAR","Riyal saoudien"]
];

let rates = {};
let lastUpdate = null;

const fromSel = document.getElementById("from");
const toSel   = document.getElementById("to");
const amountEl = document.getElementById("amount");
const resultEl = document.getElementById("result");
const rateInfoEl = document.getElementById("rateInfo");
const refreshIcon = document.getElementById("refreshIcon");

CURRENCIES.forEach(([code, name]) => {
  fromSel.appendChild(new Option(`${code} — ${name}`, code));
  toSel.appendChild(new Option(`${code} — ${name}`, code));
});
fromSel.value = "EUR";
toSel.value   = "USD";

async function fetchRates() {
  refreshIcon.classList.add("spin");
  rateInfoEl.textContent = "Chargement...";
  try {
    const res  = await fetch("https://api.frankfurter.app/latest?base=" + fromSel.value);
    const data = await res.json();
    rates = data.rates;
    rates[fromSel.value] = 1;
    lastUpdate = new Date();
    convert();
    const t = lastUpdate.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    const r = rates[toSel.value];
    rateInfoEl.textContent = `1 ${fromSel.value} = ${r ? r.toFixed(4) : "—"} ${toSel.value} · ${t}`;
  } catch (e) {
    rateInfoEl.textContent = "Erreur de connexion.";
    resultEl.textContent = "—";
  }
  refreshIcon.classList.remove("spin");
}

function convert() {
  const amount = parseFloat(amountEl.value);
  const rate   = rates[toSel.value];
  if (!isNaN(amount) && rate) {
    resultEl.textContent = amount * rate < 1000
      ? (amount * rate).toLocaleString("fr-FR", { maximumFractionDigits: 4 }) + " " + toSel.value
      : (amount * rate).toLocaleString("fr-FR", { maximumFractionDigits: 2 }) + " " + toSel.value;
  } else {
    resultEl.textContent = "—";
  }
}

fromSel.addEventListener("change", fetchRates);
toSel.addEventListener("change", () => {
  convert();
  const r = rates[toSel.value];
  if (r && lastUpdate) {
    const t = lastUpdate.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    rateInfoEl.textContent = `1 ${fromSel.value} = ${r.toFixed(4)} ${toSel.value} · ${t}`;
  }
});
amountEl.addEventListener("input", convert);

document.getElementById("swapBtn").addEventListener("click", () => {
  const tmp = fromSel.value;
  fromSel.value = toSel.value;
  toSel.value = tmp;
  fetchRates();
});

document.getElementById("refreshBtn").addEventListener("click", fetchRates);

fetchRates();
setInterval(fetchRates, 60000);
</script>
<script>
// Onglet flottant "Nos autres sites" — réseau de sites
(function(){
  const SITES=[

    {nom:'Wikinoo — astuces',url:'https://biloute26.github.io/wikinoo/',ic:'💡'},

    {nom:'Calculateurs immobiliers',url:'https://biloute26.github.io/immo/',ic:'🏠'},
    {nom:'Outils administratifs',url:'https://biloute26.github.io/outils-administratifs/',ic:'📋'},
    {nom:'Outils pratiques du quotidien',url:'https://biloute26.github.io/Outils-pratiques-du-Quotidien/',ic:'🧰'}
  ];
  const HERE=location.href.replace(/index\.html$/,'');
  const css=`
  #netTab{position:fixed;left:0;top:38%;z-index:9000;font-family:'Inter',-apple-system,sans-serif}
  #netTab .nt-toggle{position:absolute;left:0;top:0;background:#1F3A2E;color:#fff;border:none;border-right:2px solid #C9A24B;
    writing-mode:vertical-rl;text-orientation:mixed;padding:14px 8px;border-radius:0 10px 10px 0;cursor:pointer;font-size:13px;
    font-weight:600;letter-spacing:.05em;box-shadow:2px 2px 10px rgba(0,0,0,.15);transition:background .2s}
  #netTab .nt-toggle:hover{background:#2E5141}
  #netTab .nt-panel{position:absolute;left:-300px;top:0;width:280px;background:#fff;border:1px solid #D8CFBC;border-left:3px solid #C9A24B;
    border-radius:0 12px 12px 0;box-shadow:4px 6px 24px rgba(31,58,46,.18);padding:16px;transition:left .28s ease;opacity:0;pointer-events:none}
  #netTab.open .nt-panel{left:46px;opacity:1;pointer-events:auto}
  #netTab.open .nt-toggle{background:#2E5141}
  #netTab .nt-title{font-family:'Fraunces',Georgia,serif;font-size:15px;color:#1F3A2E;font-weight:600;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid #ECE6D8}
  #netTab a.nt-link{display:flex;align-items:center;gap:10px;padding:10px;border-radius:9px;color:#23231F;text-decoration:none;font-size:14px;transition:background .15s}
  #netTab a.nt-link:hover{background:#F3EFE6}
  #netTab a.nt-link .nt-ic{width:30px;height:30px;border-radius:7px;background:#F3EFE6;display:grid;place-items:center;font-size:16px;flex-shrink:0}
  #netTab a.nt-link.current{opacity:.5;pointer-events:none}
  #netTab a.nt-link.current:after{content:'(vous êtes ici)';font-size:11px;color:#6B6557;margin-left:auto}
  @media(max-width:680px){#netTab{top:auto;bottom:80px}#netTab .nt-panel{width:240px;top:auto;bottom:0;max-height:70vh;overflow-y:auto}#netTab.open .nt-panel{left:42px}}
  @media(prefers-reduced-motion:reduce){#netTab .nt-panel{transition:none}}
  `;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const wrap=document.createElement('div');wrap.id='netTab';
  let links='';
  SITES.forEach(s=>{const cur=HERE.indexOf(s.url)===0||s.url.indexOf(HERE)===0;
    links+=`<a class="nt-link${cur?' current':''}" href="${s.url}"${cur?'':' '}><span class="nt-ic">${s.ic}</span><span>${s.nom}</span></a>`;});
  wrap.innerHTML=`<button class="nt-toggle" aria-label="Nos autres sites">＋ Nos sites</button>
    <div class="nt-panel"><p class="nt-title">Nos autres sites</p>${links}</div>`;
  document.body.appendChild(wrap);
  const tog=wrap.querySelector('.nt-toggle');
  tog.addEventListener('click',()=>wrap.classList.toggle('open'));
  document.addEventListener('click',e=>{if(!wrap.contains(e.target))wrap.classList.remove('open');});
})();

</script>
</body>
</html>
